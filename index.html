<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stack 3D</title>
<style>
:root{--accent:#ff71ce}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif;background:#1a1a2e;user-select:none;-webkit-user-select:none;color:#fff}
canvas{display:block}
#ui{position:fixed;top:12px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:10;width:100%}
#score{font-size:4.2rem;font-weight:800;text-shadow:0 4px 14px rgba(0,0,0,.6);margin:0;line-height:1}
#high-score{font-size:1rem;opacity:.85}
#hud-left{position:fixed;top:12px;left:12px;z-index:15;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 9px;font-size:.78rem;font-weight:700;letter-spacing:.02em;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#coins{color:#ffd966}
#perfect-pill.hot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 10px var(--accent)}
#special-banner{margin-top:8px;font-size:1.3rem;font-weight:800;text-shadow:0 2px 8px #000;min-height:1.6em}
#bomb-hud{position:fixed;left:12px;bottom:12px;z-index:15;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#bomb-btn{position:relative;overflow:hidden;font-size:1.15rem;font-weight:800;padding:10px 14px;border-radius:14px;cursor:pointer;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.6);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4);min-width:110px}
#bomb-btn:disabled{opacity:.45;cursor:default}
#bomb-btn.ready{border-color:#ff3b30;box-shadow:0 0 12px #ff3b30}
#bomb-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,rgba(255,149,0,.55),rgba(255,59,48,.55));transition:width .25s;pointer-events:none}
#bomb-btn.ready #bomb-fill{background:linear-gradient(90deg,rgba(255,149,0,.75),rgba(255,59,48,.75))}
#bomb-label{position:relative;z-index:1}
#frenzy-hud{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:18;display:none;flex-direction:column;align-items:center;gap:8px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:96vw}
#frenzy-hud.show{display:flex}
#frenzy-title{font-weight:800;font-size:.95rem;letter-spacing:.04em;text-shadow:0 2px 6px #000}
#frenzy-timer{width:220px;max-width:70vw;height:10px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;border:1px solid rgba(255,255,255,.25)}
#frenzy-timer-fill{height:100%;width:100%;background:linear-gradient(90deg,#ff2d2d,#2dff5e,#2d7bff,#ffe72d);transition:width .1s linear}
#frenzy-btns{display:flex;gap:10px}
.frenzy-btn{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.85);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5);font-size:1.3rem}
.frenzy-btn:active{transform:scale(.92)}

#menu{position:fixed;top:12px;right:12px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#menu-btn{width:44px;height:44px;padding:0;font-size:1.3rem;line-height:1;border-radius:14px;background:rgba(0,0,0,.6)}
#menu-popup{display:none;flex-direction:column;gap:8px;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#menu.open #menu-popup{display:flex}
#menu-popup .btn{width:100%;text-align:center}
#menu-btn:active{background:rgba(255,255,255,.25)}
.btn{cursor:pointer;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.55);color:#fff;border-radius:12px;padding:10px 14px;font-size:1rem}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30;transition:opacity .25s}
#gameover{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:40;background:rgba(0,0,0,.6)}
#gameover .card{background:#16162a;border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:26px 28px;text-align:center;max-width:92vw;width:380px}
#shop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;background:rgba(0,0,0,.65)}
#shop .card{background:#16162a;border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:20px;max-width:94vw;width:520px;max-height:88vh;overflow:auto}
.shop-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.shop-item{flex:1 1 140px;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px;text-align:center;background:rgba(255,255,255,.05)}
.shop-item.active{border-color:var(--accent);box-shadow:0 0 12px var(--accent)}
.shop-item button{margin-top:8px;width:100%;padding:8px;border-radius:10px;border:0;cursor:pointer;font-weight:700}
@media(max-width:600px){#score{font-size:3rem}.pill{font-size:.72rem;padding:2px 8px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="hud-left"><div class="pill" id="coins">🪙 0</div><div class="pill" id="perfect-pill">Perfect x0</div></div>
<div id="ui"><div id="score">0</div><div id="high-score">Record: 0</div>
<!-- HUD monete/perfect spostato in alto a sinistra -->
<div id="special-banner"></div>
</div>

<div id="bomb-hud"><button id="bomb-btn" title="Usa bomba (B)"><div id="bomb-fill"></div><span id="bomb-label">💣 0/3</span></button></div>
<div id="frenzy-hud"><div id="frenzy-title">🎨 FRENZY COLOR BLAST</div><div id="frenzy-timer"><div id="frenzy-timer-fill"></div></div><div id="frenzy-btns"><button class="frenzy-btn" data-color="red" style="background:#ff2d2d" aria-label="Spara rosso">🔴</button><button class="frenzy-btn" data-color="green" style="background:#2dff5e" aria-label="Spara verde">🟢</button><button class="frenzy-btn" data-color="blue" style="background:#2d7bff" aria-label="Spara blu">🔵</button><button class="frenzy-btn" data-color="yellow" style="background:#ffe72d" aria-label="Spara giallo">🟡</button></div><div id="frenzy-info" style="font-size:.8rem;font-weight:700;opacity:.9"></div></div>
<div id="menu"><button class="btn" id="menu-btn" aria-label="Menu">&#9776;</button><div id="menu-popup"><button class="btn" id="restart-btn">Restart</button><button class="btn" id="shop-btn">Shop</button></div></div>
<div id="flash"></div>
<div id="gameover"><div class="card"><h1>GAME OVER</h1><p id="go-reason"></p><p id="go-stats"></p><button class="btn" id="go-retry">Gioca ancora</button> <button class="btn" id="go-shop">Shop</button></div></div>
<div id="shop"><div class="card"><h2 style="margin:0">Negozio <span id="shop-coins" style="float:right">0</span></h2><p style="opacity:.8">Temi e forme salvati in localStorage. Monete da blocchi oro e serie Perfect.</p><h3>Temi grafici</h3><div class="shop-row" id="themes"></div><h3>Forme blocchi</h3><div class="shop-row" id="shapes"></div><button class="btn" id="shop-close" style="width:100%">Chiudi</button></div></div>
<script>
/* STACK 3D punti 3..7 GDD */
let scene,camera,renderer,towerGroup,ambientLight,dirLight;
let stack=[],overhangs=[],particles=[];
let score=0,highScore=parseInt(localStorage.getItem('stack_3d_highscore')||'0',10);
let coins=parseInt(localStorage.getItem('stack3d_coins')||'0',10);
let perfectStreak=0,bestStreak=parseInt(localStorage.getItem('stack3d_beststreak')||'0',10);
let bombs=0,bombProgress=0;const BOMB_MAX=3,BOMB_EVERY=10,BOMB_POWER=10;
const TNT_POWER=2;
let gameEnded=false,gameStarted=false;
const boxHeight=1;let speed=0.15,currentDirection='x';
const PERFECT_TOL=0.3;
const COIN_GOLD_TOL=0.1,COIN_EDGE_RATIO=0.25;
const COIN_GOLD_MIN=15,COIN_GOLD_MAX=20,COIN_STD_MIN=3,COIN_STD_MAX=5;
const FRENZY_COLORS=['red','green','blue','yellow'];
const FRENZY_HEX={red:0xff2d2d,green:0x2dff5e,blue:0x2d7bff,yellow:0xffe72d};
const FRENZY_CSS={red:'#ff2d2d',green:'#2dff5e',blue:'#2d7bff',yellow:'#ffe72d'};
const FRENZY_CHECK_EVERY=15,FRENZY_CHANCE=0.10,FRENZY_DURATION=5;
let frenzyActive=false,frenzyTimeLeft=0,frenzyTimerId=null,frenzySinceCheck=0,frenzyFlashId=null,frenzyStartLen=0,frenzyHits=0;
let projectiles=[];
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}

let shakeTime=0,shakeMag=0;
let demolishing=false,demolishSeq=0;
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
let currentSpecial=null,specialCountdown=5,blinkT=0;
const THEMES={
 classic:{name:'Classico',price:0,bg:0x1a1a2e,amb:0xffffff,ambI:.6,dir:0xffffff,dirI:.6,fog:null,accent:'#ffffff',part:['#ffffff','#ffe27a']},
 vaporwave:{name:'Vaporwave Neon',price:50,bg:0x2b1055,amb:0xff71ce,ambI:.7,dir:0x01cdfe,dirI:.9,fog:0x2b1055,accent:'#ff71ce',part:['#ff71ce','#01cdfe','#fffb96']},
 cyberpunk:{name:'Cyberpunk',price:100,bg:0x0b0e1a,amb:0x00ffe7,ambI:.55,dir:0xff0055,dirI:.9,fog:0x0b0e1a,accent:'#00ffe7',part:['#00ffe7','#ff0055','#f9f002']},
 pastel:{name:'Pastel Sweet',price:75,bg:0x3a2b4d,amb:0xffd6e8,ambI:.8,dir:0xfff3b0,dirI:.7,fog:null,accent:'#ffd6e8',part:['#ffd6e8','#c1f0f6','#fff3b0']}
};
const SHAPES={cube:{name:'Cubi',price:0},cylinder:{name:'Cilindri',price:50},crystal:{name:'Cristalli',price:100}};
let themeId=localStorage.getItem('stack3d_theme')||'classic';
let shapeId=localStorage.getItem('stack3d_shape')||'cube';
let owned=[];try{owned=JSON.parse(localStorage.getItem('stack3d_owned')||'["classic","cube"]');}catch(e){owned=['classic','cube'];}
if(!THEMES[themeId])themeId='classic';if(!SHAPES[shapeId])shapeId='cube';
const $=id=>document.getElementById(id);
function saveMeta(){localStorage.setItem('stack3d_coins',coins);localStorage.setItem('stack3d_theme',themeId);localStorage.setItem('stack3d_shape',shapeId);localStorage.setItem('stack3d_owned',JSON.stringify(owned));localStorage.setItem('stack3d_beststreak',bestStreak);}
function vibrate(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function flash(op,color){const f=$('flash');f.style.background=color||'#fff';f.style.opacity=op;setTimeout(()=>f.style.opacity=0,80);}
function shake(m,t){shakeMag=Math.max(shakeMag,m);shakeTime=Math.max(shakeTime,t);}
function banner(txt,ms){const b=$('special-banner');b.textContent=txt;clearTimeout(b._t);b._t=setTimeout(()=>b.textContent='',ms||2200);}
function refreshHUD(){$('score').textContent=score;$('high-score').textContent='Record: '+highScore;$('coins').textContent='🪙 '+coins;$('perfect-pill').textContent='Perfect x'+perfectStreak;$('perfect-pill').classList.toggle('hot',perfectStreak>0);$('shop-coins').textContent='monete '+coins;const bb=$('bomb-btn'),bf=$('bomb-fill'),bl=$('bomb-label');if(bb){if(bl)bl.textContent='💣 '+bombs+'/'+BOMB_MAX;else bb.textContent='💣 '+bombs+'/'+BOMB_MAX;bb.disabled=bombs<=0||gameEnded;bb.classList.toggle('ready',bombs>0);}if(bf){bf.style.width=(bombs>=BOMB_MAX?100:(bombProgress/BOMB_EVERY*100))+'%';}}
function specialTexture(kind){
 const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
 if(kind==='coin'){const gr=g.createLinearGradient(0,0,128,128);gr.addColorStop(0,'#fff6b0');gr.addColorStop(.5,'#ffd700');gr.addColorStop(1,'#b8860b');g.fillStyle=gr;g.fillRect(0,0,128,128);g.strokeStyle='#7a5c00';g.lineWidth=10;g.strokeRect(5,5,118,118);g.fillStyle='#7a5c00';g.font='bold 72px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('$',64,70);}
 else if(kind==='tnt'){g.fillStyle='#c0392b';g.fillRect(0,0,128,128);g.fillStyle='#7b1f14';g.fillRect(0,0,128,14);g.fillRect(0,114,128,14);g.fillRect(0,0,14,128);g.fillRect(114,0,14,128);g.fillStyle='#fff';g.font='bold 44px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('TNT',64,66);g.font='bold 30px sans-serif';g.fillText('!!!',64,98);}
 else if(kind==='magnet'){g.fillStyle='#0b5fa5';g.fillRect(0,0,128,128);g.fillStyle='#e74c3c';g.fillRect(0,0,128,26);g.fillRect(0,102,128,26);g.fillStyle='#fff';g.font='bold 64px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('U',64,66);g.font='bold 22px sans-serif';g.fillText('N+S',64,100);}
 return new THREE.CanvasTexture(c);
}
function makeMesh(w,h,d,special){
 let geo;
 if(shapeId==='cylinder')geo=new THREE.CylinderGeometry(.5,.5,1,28);
 else if(shapeId==='crystal')geo=new THREE.CylinderGeometry(.5,.5,1,6);
 else geo=new THREE.BoxGeometry(1,1,1);
 let color,emissive=0x000000,map=null;
 const lvl=stack.length;
 if(special==='tnt'){color=new THREE.Color(0xff2d20);emissive=0x660000;map=specialTexture('tnt');}
 else if(special==='magnet'){color=new THREE.Color(0x00c3ff);emissive=0x004466;map=specialTexture('magnet');}
 else if(special==='coin'){color=new THREE.Color(0xffd700);emissive=0x7a5c00;map=specialTexture('coin');}
 else color=new THREE.Color('hsl('+((lvl*14)%360)+', 75%, 60%)');
 const mat=new THREE.MeshLambertMaterial({color:color,emissive:emissive,map:map});
 const m=new THREE.Mesh(geo,mat);m.scale.set(Math.max(w,.001),h,Math.max(d,.001));m.userData.special=special||null;
 if(special){try{const eg=new THREE.EdgesGeometry(geo);const lc=special==='coin'?0xfff176:(special==='tnt'?0xffffff:0x002233);const lm=new THREE.LineBasicMaterial({color:lc});const lines=new THREE.LineSegments(eg,lm);lines.scale.set(1.02,1.02,1.02);m.add(lines);}catch(e){}}
 return m;
}
function applyTheme(id){themeId=id;const t=THEMES[id];scene.background=new THREE.Color(t.bg);scene.fog=t.fog?new THREE.Fog(t.fog,40,110):null;ambientLight.color.set(t.amb);ambientLight.intensity=t.ambI;dirLight.color.set(t.dir);dirLight.intensity=t.dirI;document.documentElement.style.setProperty('--accent',t.accent);saveMeta();}
function addLayer(x,z,w,d,special){const y=boxHeight*stack.length;const mesh=makeMesh(w,boxHeight,d,special);mesh.position.set(x,y,z);towerGroup.add(mesh);stack.push({mesh:mesh,width:w,depth:d,x:x,z:z,special:special||null});}
const partGeo=new THREE.BoxGeometry(.22,.22,.22);
function spawnBurst(pos,colors,n,power){n=n||14;power=power||3;for(let i=0;i<n;i++){const c=colors[Math.floor(Math.random()*colors.length)];const m=new THREE.Mesh(partGeo,new THREE.MeshBasicMaterial({color:new THREE.Color(c)}));m.position.copy(pos);scene.add(m);particles.push({mesh:m,vx:(Math.random()-.5)*power,vy:Math.random()*power+1,vz:(Math.random()-.5)*power,life:50+Math.random()*30});}if(particles.length>400){const p=particles.splice(0,particles.length-400);p.forEach(o=>scene.remove(o.mesh));}}
function addOverhang(x,z,w,d,color){const y=boxHeight*(stack.length-1);const mesh=makeMesh(w,boxHeight,d,null);mesh.material=new THREE.MeshLambertMaterial({color:color||0xffffff});mesh.position.set(x,y,z);scene.add(mesh);spawnBurst(mesh.position,THEMES[themeId].part,10);overhangs.push({mesh:mesh,speedY:0,rx:(Math.random()-.5)*.08,rz:(Math.random()-.5)*.08,vx:(Math.random()-.5)*.3,vz:(Math.random()-.5)*.3});}
function pickSpecial(){if(frenzyActive)return null;if(score<4)return null;specialCountdown--;if(specialCountdown>0)return null;specialCountdown=5+Math.floor(Math.random()*5);const r=Math.random();if(r<.35)return 'coin';if(r<.65)return 'magnet';return 'tnt';}
function topIsMovingTarget(){return stack.length>1&&!stack[stack.length-1].frenzyColor;}
function frenzyColorize(l){const c=FRENZY_COLORS[Math.floor(Math.random()*FRENZY_COLORS.length)];l.frenzyColor=c;try{const m=l.mesh;if(!m.userData.frenzyOrig){m.userData.frenzyOrig=m.material.color.clone();try{m.userData.frenzyEmiOrig=m.material.emissive?m.material.emissive.getHex():0;}catch(e){m.userData.frenzyEmiOrig=0;}m.userData.frenzyHadMap=!!m.material.map;m.userData.frenzyMapOrig=m.material.map||null;}
  // i blocchi speciali (moneta/magnete/TNT) hanno una texture: va tolta durante il frenzy
  // altrimenti colore*texture resta sporco e il colore da colpire non si riconosce
  if(m.material.map){m.material.map=null;m.material.needsUpdate=true;}
  m.material.color.setHex(FRENZY_HEX[c]);m.material.emissive=new THREE.Color(FRENZY_HEX[c]).multiplyScalar(.25);
  // nascondi outline speciale cosi' il blocco sembra un blocco frenzy normale
  try{m.children.forEach(ch=>{if(ch.isLineSegments){ch.userData.frenzyHidden=true;ch.visible=false;}});}catch(e){}}catch(e){}return c;}
function frenzyRestore(l){try{const m=l.mesh;if(m.userData.frenzyOrig){try{m.material.color.copy(m.userData.frenzyOrig);}catch(e){}delete m.userData.frenzyOrig;}const eo=(m.userData.frenzyEmiOrig!==undefined)?m.userData.frenzyEmiOrig:0;try{if(m.material.emissive)m.material.emissive.setHex(eo);}catch(e){}delete m.userData.frenzyEmiOrig;if(m.userData.frenzyHadMap&&m.userData.frenzyMapOrig){try{m.material.map=m.userData.frenzyMapOrig;m.material.needsUpdate=true;}catch(e){}}delete m.userData.frenzyMapOrig;delete m.userData.frenzyHadMap;try{m.children.forEach(ch=>{if(ch.isLineSegments&&ch.userData.frenzyHidden){ch.visible=true;delete ch.userData.frenzyHidden;}});}catch(e){}}catch(e){}delete l.frenzyColor;}
function frenzyMaybeTrigger(){if(frenzyActive||gameEnded)return;frenzySinceCheck++;if(frenzySinceCheck<FRENZY_CHECK_EVERY)return;frenzySinceCheck=0;if(Math.random()<FRENZY_CHANCE)startFrenzy();}
function startFrenzy(){
 if(frenzyActive||gameEnded||demolishing||stack.length<=4)return;
 frenzyActive=true;frenzyTimeLeft=FRENZY_DURATION;frenzyStartLen=stack.length;frenzyHits=0;
 // colora solo i blocchi piazzati della torre (conserva le 2 basi, escludi il pezzo in movimento in cima)
 for(let i=2;i<stack.length-1;i++)frenzyColorize(stack[i]);
 $('frenzy-hud').classList.add('show');updateFrenzyHUD();
 banner('🎨 FRENZY COLOR BLAST!');flash(.6,'#ff71ce');shake(.6,.5);vibrate([60,40,60,40,80]);
 clearInterval(frenzyTimerId);clearInterval(frenzyFlashId);
 frenzyTimerId=setInterval(()=>{frenzyTimeLeft-=.1;if(frenzyTimeLeft<=0){endFrenzy();return;}updateFrenzyHUD();},100);
 // lampeggio titolo
 let on=true;frenzyFlashId=setInterval(()=>{const t=$('frenzy-title');if(t)t.style.color=on?'#ffe72d':'#ffffff';on=!on;},250);
}
function frenzyTop(){return stack.length>2?stack[stack.length-2]:null;}
function updateFrenzyHUD(){const f=$('frenzy-timer-fill');if(f)f.style.width=Math.max(0,frenzyTimeLeft/FRENZY_DURATION*100)+'%';const n=frenzyTop();const need=n&&n.frenzyColor?('<span style="color:'+FRENZY_CSS[n.frenzyColor]+'">● '+n.frenzyColor.toUpperCase()+'</span>'):'—';const i=$('frenzy-info');if(i)i.innerHTML='Colpisci la cima: '+need+' · Distrutti: '+frenzyHits+' · '+Math.max(0,frenzyTimeLeft).toFixed(1)+'s';}
function shootFrenzy(color){
 if(!frenzyActive||gameEnded)return;
 const top=frenzyTop();
 if(!top||stack.length<=3){endFrenzy();return;}
 // sfera colorata: cade dall'alto verso la cima fisica della torre
 const tp=new THREE.Vector3();top.mesh.getWorldPosition(tp);
 const from=new THREE.Vector3(tp.x,tp.y+14,tp.z);
 const geo=new THREE.SphereGeometry(.55,18,18);
 const mat=new THREE.MeshBasicMaterial({color:FRENZY_HEX[color]});
 const mesh=new THREE.Mesh(geo,mat);mesh.position.copy(from);scene.add(mesh);
 projectiles.push({mesh:mesh,color:color,target:tp.clone(),t:0,from:from.clone()});
 vibrate(15);
}
function frenzyHit(top,color){
 const need=top.frenzyColor;
 const tp=new THREE.Vector3();top.mesh.getWorldPosition(tp);
 if(color===need){
  // match: distruggi la cima fisica (indice len-2, il pezzo in movimento resta dov'e'), mai le 2 basi
  if(stack.length>3){
   const idx=stack.length-2;const l=stack.splice(idx,1)[0];const pp=new THREE.Vector3();l.mesh.getWorldPosition(pp);spawnBurst(pp,[FRENZY_CSS[color],'#ffffff'],22,5);towerGroup.remove(l.mesh);
   frenzyHits++;score++;if(score>highScore){highScore=score;localStorage.setItem('stack_3d_highscore',highScore);}
   coins+=2;flash(.3,FRENZY_CSS[color]);shake(.25,.2);vibrate(35);
   for(let i=0;i<stack.length;i++){stack[i].mesh.position.y=boxHeight*i;}
   refreshHUD();updateFrenzyHUD();
   const targetY=20+(stack.length-2)*boxHeight;camera.position.y=Math.min(camera.position.y,targetY);
   if(stack.length<=3){endFrenzy();return;}
  }else endFrenzy();
 }else{
  spawnBurst(tp,['#555555','#888888'],10,3);flash(.2,'#555555');vibrate(10);
  banner('Colore sbagliato! Serve '+need.toUpperCase());
  updateFrenzyHUD();
 }
}
function endFrenzy(){
 if(!frenzyActive)return;
 frenzyActive=false;clearInterval(frenzyTimerId);clearInterval(frenzyFlashId);frenzyTimerId=frenzyFlashId=null;
 projectiles.forEach(p=>scene.remove(p.mesh));projectiles=[];
 $('frenzy-hud').classList.remove('show');
 // ripristina colori originali dei blocchi rimasti + scala Y (pulse frenzy)
 for(let i=0;i<stack.length;i++){if(stack[i].frenzyColor)frenzyRestore(stack[i]);try{stack[i].mesh.scale.y=boxHeight;}catch(e){}}
 // come per le bombe: la dimensione dei pezzi nuovi si resetta a quella del primo attualmente in cima, la velocita' NON si resetta
 const topNow=stack[stack.length-2];const moving=stack[stack.length-1];
 if(topNow&&moving){moving.width=topNow.width;moving.depth=topNow.depth;moving.mesh.scale.x=Math.max(topNow.width,.001);moving.mesh.scale.z=Math.max(topNow.depth,.001);moving.mesh.position.x=topNow.mesh.position.x;moving.mesh.position.z=topNow.mesh.position.z;moving.x=moving.mesh.position.x;moving.z=moving.mesh.position.z;moving.mesh.position.y=boxHeight*(stack.length-1);}
 // (speed volutamente invariata)
 banner('Frenzy finito! -'+frenzyHits+' pezzi');flash(.5,'#ffffff');saveMeta();refreshHUD();
 frenzySinceCheck=0;
}

async function handlePlace(){
 if(gameEnded){restartGame();return;}
 if(demolishing||frenzyActive)return;
 if($('shop').style.display==='flex')return;
 if(!gameStarted)gameStarted=true;
 const top=stack[stack.length-1],prev=stack[stack.length-2];
 const size=currentDirection==='x'?top.width:top.depth;
 let delta=top.mesh.position[currentDirection]-prev.mesh.position[currentDirection];
 let snapTol=PERFECT_TOL;
 if(top.special==='magnet'){if(Math.abs(delta)<size){delta*=0.25;top.mesh.position[currentDirection]=prev.mesh.position[currentDirection]+delta;snapTol=1.6;}}
 const placeErr=Math.abs(delta);
 const overlap=size-placeErr;
 const overlapRatio=size>0?overlap/size:0;
 if(overlap>0){
  const isPerfect=Math.abs(delta)<snapTol;
  if(isPerfect){
   top.mesh.position[currentDirection]=prev.mesh.position[currentDirection];top.x=top.mesh.position.x;top.z=top.mesh.position.z;
   perfectStreak++;bestStreak=Math.max(bestStreak,perfectStreak);coins+=1;if(bombs<BOMB_MAX){bombProgress++;if(bombProgress>=BOMB_EVERY){bombProgress=0;bombs=Math.min(BOMB_MAX,bombs+1);banner('💣 Bomba caricata! ('+bombs+'/'+BOMB_MAX+')');flash(.6,'#ff9500');vibrate([40,40,80]);}}
   if(perfectStreak%3===0){coins+=5;banner('PERFECT x'+perfectStreak+'! +6 monete');}else banner('PERFECT!');
   flash(.45);vibrate(50);
   const wp=new THREE.Vector3();top.mesh.getWorldPosition(wp);spawnBurst(wp,['#ffffff'].concat(THEMES[themeId].part),22,4);
  }else{
   perfectStreak=0;
   const cutW=currentDirection==='x'?overlap:top.width,cutD=currentDirection==='z'?overlap:top.depth;
   top.width=cutW;top.depth=cutD;top.mesh.scale.x=Math.max(cutW,.001);top.mesh.scale.z=Math.max(cutD,.001);
   top.mesh.position[currentDirection]-=delta/2;
   const overSize=Math.abs(delta),shift=(overlap/2+overSize/2)*Math.sign(delta);
   const ox=currentDirection==='x'?top.mesh.position.x+shift:top.mesh.position.x;
   const oz=currentDirection==='z'?top.mesh.position.z+shift:top.mesh.position.z;
   addOverhang(ox,oz,currentDirection==='x'?overSize:top.width,currentDirection==='z'?overSize:top.depth,top.mesh.material.color.clone());
   vibrate(20);
  }
  const placed=top.special;top.special=null;
  if(placed==='coin'){
   if(placeErr<COIN_GOLD_TOL){const rw=randInt(COIN_GOLD_MIN,COIN_GOLD_MAX);coins+=rw;banner('PERFETTO DORATO! +'+rw+' monete');flash(.7,'#ffd700');shake(.4,.3);vibrate([30,30,60]);const gp=new THREE.Vector3();top.mesh.getWorldPosition(gp);spawnBurst(gp,['#ffd700','#fff6b0','#ffffff','#ff9500'],42,6);}
   else if(overlapRatio<COIN_EDGE_RATIO){banner('Moneta frantumata! +0 monete');flash(.4,'#888888');shake(.5,.3);vibrate(60);const sp=new THREE.Vector3();top.mesh.getWorldPosition(sp);spawnBurst(sp,['#888888','#555555','#cccccc'],30,5);}
   else{const rw=randInt(COIN_STD_MIN,COIN_STD_MAX);coins+=rw;banner('Moneta opaca +'+rw+' monete');vibrate(30);}
  }
  if(placed==='magnet'&&!isPerfect)banner('Magnete: attrazione assistita!');
  if(placed==='tnt')await detonateTNT();
  score++;if(score>highScore){highScore=score;localStorage.setItem('stack_3d_highscore',highScore);}
  saveMeta();refreshHUD();
  currentDirection=currentDirection==='x'?'z':'x';if(placed!=='tnt')speed+=0.005;
  // TNT come bomba/frenzy: dimensione nuovi pezzi resettata al top attuale (ref sotto), velocita' invariata (no reset, no aumento)
  currentSpecial=pickSpecial();
  if(currentSpecial)banner({tnt:'---- TNT IN ARRIVO ----',magnet:'---- MAGNETE IN ARRIVO ----',coin:'---- BLOCCO DORATO IN ARRIVO ----'}[currentSpecial],1800);
  const ref=stack[stack.length-1];addLayer(currentDirection==='x'?-20:ref.mesh.position.x,currentDirection==='z'?-20:ref.mesh.position.z,ref.width,ref.depth,currentSpecial);
  frenzyMaybeTrigger();
 }else{endGame();}
}
async function detonateBomb(){
 if(gameEnded||demolishing||frenzyActive||bombs<=0||stack.length<=3)return;
 demolishing=true;const mySeq=++demolishSeq;
 bombs--;refreshHUD();
 const total=Math.min(BOMB_POWER,(stack.length-1)-2);
 banner('-'+total+' pezzi');flash(.7,'#ff9500');shake(1.2,.7);vibrate([80,50,80]);
 const wp=new THREE.Vector3();stack[stack.length-1].mesh.getWorldPosition(wp);spawnBurst(wp,['#ff9500','#ff3b30','#ffe27a','#555555'],60,8);
 // distruzione a cascata: un pezzo alla volta dall'alto verso il basso (conserva le 2 basi); il pezzo in movimento resta dov'e'
 let removed=0;
 while(removed<total){
  if(mySeq!==demolishSeq||gameEnded)break;
  const idx=stack.length-2;const l=stack.splice(idx,1)[0];
  const pp=new THREE.Vector3();l.mesh.getWorldPosition(pp);spawnBurst(pp,['#ff9500','#ff3b30','#555555'],16,5);towerGroup.remove(l.mesh);removed++;
  flash(.25,'#ff9500');shake(.3,.25);vibrate(30);
  for(let i=0;i<stack.length;i++){stack[i].mesh.position.y=boxHeight*i;}
  await sleep(130);
 }
 // reset dimensione del pezzo in movimento a quella del primo attualmente in cima (il top fisico), senza toccare speed
 const topNow=stack[stack.length-2];const moving=stack[stack.length-1];
 if(topNow&&moving){moving.width=topNow.width;moving.depth=topNow.depth;moving.mesh.scale.x=Math.max(topNow.width,.001);moving.mesh.scale.z=Math.max(topNow.depth,.001);moving.mesh.position.x=topNow.mesh.position.x;moving.mesh.position.z=topNow.mesh.position.z;moving.x=moving.mesh.position.x;moving.z=moving.mesh.position.z;moving.mesh.position.y=boxHeight*(stack.length-1);}
 // abbassa subito la camera insieme alla torre tagliata
 const targetY=20+(stack.length-2)*boxHeight;camera.position.y=Math.min(camera.position.y,targetY);camera.lookAt(0,camera.position.y-20,0);
 demolishing=false;
 saveMeta();refreshHUD();
}
async function detonateTNT(){
 const below=Math.min(TNT_POWER,stack.length-3);
 if(below<=0)return 0;
 demolishing=true;const mySeq=++demolishSeq;
 banner('-'+below+' pezzi');flash(.7,'#ff9500');shake(1.2,.7);vibrate([80,50,80]);
 const wp=new THREE.Vector3();stack[stack.length-1].mesh.getWorldPosition(wp);spawnBurst(wp,['#ff9500','#ff3b30','#ffe27a','#555555'],60,8);
 // la TNT stessa esplode (non conteggiata), poi distruzione a cascata dei pezzi sotto: uno alla volta dall'alto verso il basso, identica alla bomba (si tocca solo la Y, mai X/Z: niente slittamenti)
 const tnt=stack.pop();towerGroup.remove(tnt.mesh);
 // distruzione a cascata: un pezzo alla volta
 let removed=0;
 while(removed<below){
  if(mySeq!==demolishSeq||gameEnded)break;
  const l=stack.pop();const pp=new THREE.Vector3();l.mesh.getWorldPosition(pp);spawnBurst(pp,['#ff9500','#ff3b30','#555555'],16,5);towerGroup.remove(l.mesh);removed++;
  flash(.25,'#ff9500');shake(.3,.25);vibrate(30);
  for(let i=0;i<stack.length;i++){stack[i].mesh.position.y=boxHeight*i;}
  await sleep(130);
 }
 // NIENTE snap orizzontale del top fisso (era quello che faceva "slittare" i pezzi): i blocchi restano dove sono
 // abbassa subito la camera insieme alla torre tagliata, come la bomba
 const targetY=20+(stack.length-1)*boxHeight;camera.position.y=Math.min(camera.position.y,targetY);camera.lookAt(0,camera.position.y-20,0);
 demolishing=false;
 return removed;
}
function endGame(){
 if(gameEnded)return;gameEnded=true;vibrate(80);shake(1,.7);flash(.5,'#ff0044');
 if(frenzyActive){frenzyActive=false;clearInterval(frenzyTimerId);clearInterval(frenzyFlashId);frenzyTimerId=frenzyFlashId=null;projectiles.forEach(p=>scene.remove(p.mesh));projectiles=[];$('frenzy-hud').classList.remove('show');for(let i=0;i<stack.length;i++){if(stack[i].frenzyColor)frenzyRestore(stack[i]);}}
 const top=stack[stack.length-1];
 if(top){addOverhang(top.mesh.position.x,top.mesh.position.z,top.width,top.depth,top.mesh.material.color.clone());towerGroup.remove(top.mesh);}
 $('go-reason').textContent='Hai mancato il blocco!';
 $('go-stats').innerHTML='Punteggio: <b>'+score+'</b> - Record: <b>'+highScore+'</b><br>monete '+coins+' - best streak x'+bestStreak;
 $('gameover').style.display='flex';
}
function restartGame(){
 stack.forEach(l=>towerGroup.remove(l.mesh));overhangs.forEach(o=>scene.remove(o.mesh));particles.forEach(p=>scene.remove(p.mesh));projectiles.forEach(p=>scene.remove(p.mesh));
 stack=[];overhangs=[];particles=[];projectiles=[];score=0;speed=.15;gameEnded=false;gameStarted=false;currentDirection='x';bombs=0;bombProgress=0;demolishing=false;demolishSeq++;
 frenzyActive=false;frenzyTimeLeft=0;frenzySinceCheck=0;frenzyHits=0;clearInterval(frenzyTimerId);clearInterval(frenzyFlashId);frenzyTimerId=frenzyFlashId=null;
 currentSpecial=null;specialCountdown=5;perfectStreak=0;
 shakeTime=shakeMag=0;
 $('gameover').style.display='none';$('frenzy-hud').classList.remove('show');$('special-banner').textContent='';$('score').textContent='0';
 $('menu').classList.remove('open');
 addLayer(0,0,10,10,null);addLayer(0,0,10,10,null);
 camera.position.set(20,20,20);camera.lookAt(0,0,0);refreshHUD();
}
function buildShop(){
 const tw=$('themes');tw.innerHTML='';
 Object.keys(THEMES).forEach(id=>{const t=THEMES[id];const d=document.createElement('div');d.className='shop-item'+(id===themeId?' active':'');d.innerHTML='<b>'+t.name+'</b><br><small>'+(t.price===0?'Gratis':'monete '+t.price)+'</small><br>';const b=document.createElement('button');b.textContent=owned.indexOf(id)>=0?(id===themeId?'Attivo':'Usa'):'Compra';b.onclick=()=>{if(owned.indexOf(id)<0){if(coins<t.price){alert('Monete insufficienti! Raccogli monete oro e perfect.');return;}coins-=t.price;owned.push(id);}applyTheme(id);refreshHUD();buildShop();};d.appendChild(b);tw.appendChild(d);});
 const sw=$('shapes');sw.innerHTML='';
 Object.keys(SHAPES).forEach(id=>{const s=SHAPES[id];const d=document.createElement('div');d.className='shop-item'+(id===shapeId?' active':'');d.innerHTML='<b>'+s.name+'</b><br><small>'+(s.price===0?'Gratis':'monete '+s.price)+'</small><br>';const b=document.createElement('button');b.textContent=owned.indexOf(id)>=0?(id===shapeId?'Attivo':'Usa'):'Compra';b.onclick=()=>{if(owned.indexOf(id)<0){if(coins<s.price){alert('Monete insufficienti!');return;}coins-=s.price;owned.push(id);}shapeId=id;saveMeta();refreshHUD();buildShop();banner('Forma: '+s.name);};d.appendChild(b);sw.appendChild(d);});
}
function init(){
 scene=new THREE.Scene();
 const aspect=innerWidth/innerHeight,d=20;
 camera=new THREE.OrthographicCamera(-d*aspect,d*aspect,d,-d,-100,1000);
 camera.position.set(20,20,20);camera.lookAt(0,0,0);
 ambientLight=new THREE.AmbientLight(0xffffff,.6);scene.add(ambientLight);
 dirLight=new THREE.DirectionalLight(0xffffff,.6);dirLight.position.set(10,20,10);scene.add(dirLight);
 towerGroup=new THREE.Group();scene.add(towerGroup);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
 applyTheme(themeId);
 addLayer(0,0,10,10,null);addLayer(0,0,10,10,null);refreshHUD();buildShop();
 addEventListener('resize',()=>{const a=innerWidth/innerHeight,dd=20;camera.left=-dd*a;camera.right=dd*a;camera.top=dd;camera.bottom=-dd;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
 addEventListener('pointerdown',e=>{const inMenu=!!e.target.closest('#menu');if(!inMenu)$('menu').classList.remove('open');if(inMenu||e.target.closest('button')||e.target.closest('#shop')||e.target.closest('#gameover'))return;handlePlace();});
 addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!frenzyActive)handlePlace();}if(e.code==='KeyR')restartGame();if(e.code==='KeyB'&&!frenzyActive)detonateBomb();if(frenzyActive){if(e.code==='Digit1')shootFrenzy('red');if(e.code==='Digit2')shootFrenzy('green');if(e.code==='Digit3')shootFrenzy('blue');if(e.code==='Digit4')shootFrenzy('yellow');}});
 $('shop-btn').onclick=e=>{e.stopPropagation();$('menu').classList.remove('open');$('shop').style.display='flex';refreshHUD();};
 $('go-shop').onclick=e=>{e.stopPropagation();$('shop').style.display='flex';refreshHUD();};
 $('shop-close').onclick=e=>{e.stopPropagation();$('shop').style.display='none';};
 $('restart-btn').onclick=e=>{e.stopPropagation();$('menu').classList.remove('open');restartGame();};
 $('go-retry').onclick=e=>{e.stopPropagation();restartGame();};
 $('menu-btn').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('open');};
 $('bomb-btn').onclick=e=>{e.stopPropagation();detonateBomb();};
 document.querySelectorAll('.frenzy-btn').forEach(b=>{b.onclick=e=>{e.stopPropagation();shootFrenzy(b.dataset.color);};});
 renderer.setAnimationLoop(animation);
}
function animation(){
 const dt=1/60;blinkT+=dt;
 if(!gameEnded&&stack.length>1){
  const top=stack[stack.length-1];
  if(top.special==='tnt'){top.mesh.material.emissive.setHex(Math.sin(blinkT*18)>0?0xff2222:0x440000);const puls=1+Math.sin(blinkT*18)*0.04;top.mesh.scale.y=boxHeight*puls;}
  if(top.special==='coin'){top.mesh.rotation.y+=0.06;try{top.mesh.material.emissive.setHex(Math.sin(blinkT*9)>0?0xcc9900:0x554400);}catch(e){}}
  if(top.special==='magnet'){try{top.mesh.material.emissive.setHex(Math.sin(blinkT*10)>0?0x00aaff:0x003355);}catch(e){}}
  if(!frenzyActive){top.mesh.position[currentDirection]+=speed;
   if(top.mesh.position[currentDirection]>20)top.mesh.position[currentDirection]=-20;}
 }
 // sfere frenzy: cadono dall'alto verso la cima, all'impatto verifica il match colore
 for(let i=projectiles.length-1;i>=0;i--){const pr=projectiles[i];pr.t+=dt*2.2;if(pr.t>=1){scene.remove(pr.mesh);projectiles.splice(i,1);const cur=frenzyTop();if(frenzyActive&&cur)frenzyHit(cur,pr.color);}else{pr.mesh.position.lerpVectors(pr.from,pr.target,pr.t);pr.mesh.scale.setScalar(1+Math.sin(pr.t*Math.PI)*.3);}}
 // pulse dei blocchi frenzy
 if(frenzyActive){const pu=1+Math.sin(blinkT*10)*.03;for(let i=2;i<stack.length-1;i++){const l=stack[i];if(l&&l.frenzyColor){try{l.mesh.scale.y=boxHeight*pu;}catch(e){}}}}
 overhangs.forEach(o=>{o.speedY-=0.05;o.mesh.position.y+=o.speedY;o.mesh.position.x+=o.vx;o.mesh.position.z+=o.vz;o.mesh.rotation.x+=o.rx;o.mesh.rotation.z+=o.rz;});
 overhangs=overhangs.filter(o=>{if(o.mesh.position.y<-30){scene.remove(o.mesh);return false;}return true;});
 particles.forEach(p=>{p.life--;p.mesh.position.x+=p.vx*.08;p.mesh.position.y+=p.vy*.08;p.mesh.position.z+=p.vz*.08;p.vy-=.15;p.mesh.rotation.x+=.1;p.mesh.scale.multiplyScalar(.985);});
 particles=particles.filter(p=>{if(p.life<=0){scene.remove(p.mesh);return false;}return true;});
 const targetY=20+(stack.length-2)*boxHeight;
 if(camera.position.y<targetY)camera.position.y+=(targetY-camera.position.y)*.08;
 const baseY=camera.position.y;
 let sx=0,sy=0;
 if(shakeTime>0){shakeTime-=dt;sx=(Math.random()-.5)*shakeMag;sy=(Math.random()-.5)*shakeMag;if(shakeTime<=0)shakeMag=0;}
 camera.position.x=20+sx;camera.position.y=baseY+sy;camera.position.z=20+sx*.5;
 camera.lookAt(0,baseY-20,0);
 renderer.render(scene,camera);
}
init();
</script></body></html>
