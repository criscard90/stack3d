<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stack 3D - Gioco</title>
<style>
body{margin:0;overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif;background:#1a1a2e;user-select:none}
#ui{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center;color:#fff;pointer-events:none;z-index:10}
#score{font-size:5rem;font-weight:800;text-shadow:0 4px 10px rgba(0,0,0,.5);margin:0}
#high-score{font-size:1.2rem;opacity:.8;margin-top:5px}
#instructions{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:1.1rem;pointer-events:none;text-align:center}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="ui"><div id="score">0</div><div id="high-score">Record: 0</div></div>
<div id="instructions">Clicca o premi SPAZIO per far cadere il blocco</div>
<script>
let scene,camera,renderer;
let stack=[];
let overhangs=[];
let score=0;
let highScore=localStorage.getItem('stack_3d_highscore')||0;
let gameEnded=false;
let gameStarted=false;
const boxHeight=1;
let speed=0.15;
let currentDirection='x';
document.getElementById('high-score').innerText=`Record: ${highScore}`;
function init(){
scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a1a2e);
const aspect=window.innerWidth/window.innerHeight;
const d=20;
camera=new THREE.OrthographicCamera(-d*aspect,d*aspect,d,-d,-100,1000);
camera.position.set(20,20,20);
camera.lookAt(0,0,0);
const ambientLight=new THREE.AmbientLight(0xffffff,0.6);
scene.add(ambientLight);
const dirLight=new THREE.DirectionalLight(0xffffff,0.6);
dirLight.position.set(10,20,10);
scene.add(dirLight);
renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
addLayer(0,0,10,10);
addLayer(0,0,10,10);
window.addEventListener('resize',onWindowResize);
window.addEventListener('pointerdown',handleClick);
window.addEventListener('keydown',(e)=>{if(e.code==='Space')handleClick();});
renderer.setAnimationLoop(animation);
}
function generateColor(hue){return new THREE.Color(`hsl(${hue%360}, 75%, 60%)`);}
function addLayer(x,z,width,depth){
const y=boxHeight*stack.length;
const color=generateColor(stack.length*12);
const geometry=new THREE.BoxGeometry(width,boxHeight,depth);
const material=new THREE.MeshLambertMaterial({color});
const mesh=new THREE.Mesh(geometry,material);
mesh.position.set(x,y,z);
scene.add(mesh);
stack.push({mesh,width,depth,x,z});
}
function addOverhang(x,z,width,depth){
const y=boxHeight*(stack.length-1);
const color=stack[stack.length-1].mesh.material.color;
const geometry=new THREE.BoxGeometry(width,boxHeight,depth);
const material=new THREE.MeshLambertMaterial({color});
const mesh=new THREE.Mesh(geometry,material);
mesh.position.set(x,y,z);
scene.add(mesh);
overhangs.push({mesh,speedY:0});
}
function handleClick(){
if(gameEnded){restartGame();return;}
if(!gameStarted){gameStarted=true;document.getElementById('instructions').style.display='none';}
const topLayer=stack[stack.length-1];
const previousLayer=stack[stack.length-2];
const delta=topLayer.mesh.position[currentDirection]-previousLayer.mesh.position[currentDirection];
const size=currentDirection==='x'?topLayer.width:topLayer.depth;
const overlap=size-Math.abs(delta);
if(overlap>0){
const cutWidth=currentDirection==='x'?overlap:topLayer.width;
const cutDepth=currentDirection==='z'?overlap:topLayer.depth;
if(Math.abs(delta)<0.3){
topLayer.mesh.position[currentDirection]=previousLayer.mesh.position[currentDirection];
topLayer.x=topLayer.mesh.position.x;
topLayer.z=topLayer.mesh.position.z;
}else{
topLayer.width=cutWidth;
topLayer.depth=cutDepth;
topLayer.mesh.scale[currentDirection]=overlap/size;
topLayer.mesh.position[currentDirection]-=delta/2;
const overhangSize=Math.abs(delta);
const overhangShift=(overlap/2+overhangSize/2)*Math.sign(delta);
const overhangX=currentDirection==='x'?topLayer.mesh.position.x+overhangShift:topLayer.mesh.position.x;
const overhangZ=currentDirection==='z'?topLayer.mesh.position.z+overhangShift:topLayer.mesh.position.z;
const overhangW=currentDirection==='x'?overhangSize:topLayer.width;
const overhangD=currentDirection==='z'?overhangSize:topLayer.depth;
addOverhang(overhangX,overhangZ,overhangW,overhangD);
}
score++;
document.getElementById('score').innerText=score;
if(score>highScore){highScore=score;localStorage.setItem('stack_3d_highscore',highScore);document.getElementById('high-score').innerText=`Record: ${highScore}`;}
currentDirection=currentDirection==='x'?'z':'x';
speed+=0.005;
addLayer(currentDirection==='x'?-20:topLayer.mesh.position.x,currentDirection==='z'?-20:topLayer.mesh.position.z,topLayer.width,topLayer.depth);
}else{endGame();}
}

function endGame(){
gameEnded=true;
document.getElementById('instructions').innerText="GAME OVER! Clicca per ricominciare.";
document.getElementById('instructions').style.display='block';
const topLayer=stack[stack.length-1];
addOverhang(topLayer.mesh.position.x,topLayer.mesh.position.z,topLayer.width,topLayer.depth);
scene.remove(topLayer.mesh);
}
function restartGame(){
stack.forEach(layer=>scene.remove(layer.mesh));
overhangs.forEach(o=>scene.remove(o.mesh));
stack=[];overhangs=[];score=0;speed=0.15;
gameEnded=false;gameStarted=false;currentDirection='x';
document.getElementById('score').innerText=score;
document.getElementById('instructions').innerText="Clicca o premi SPAZIO per far cadere il blocco";
addLayer(0,0,10,10);
addLayer(0,0,10,10);
camera.position.set(20,20,20);
camera.lookAt(0,0,0);
}
function animation(){
if(!gameEnded&&stack.length>1){
const topLayer=stack[stack.length-1];
topLayer.mesh.position[currentDirection]+=speed;
if(topLayer.mesh.position[currentDirection]>20){topLayer.mesh.position[currentDirection]=-20;}
}
overhangs.forEach(o=>{o.speedY-=0.05;o.mesh.position.y+=o.speedY;o.mesh.rotation.x+=0.02;o.mesh.rotation.z+=0.02;});
const targetY=20+(stack.length-2)*boxHeight;
if(camera.position.y<targetY){camera.position.y+=(targetY-camera.position.y)*0.1;}
renderer.render(scene,camera);
}
function onWindowResize(){
const aspect=window.innerWidth/window.innerHeight;
const d=20;
camera.left=-d*aspect;camera.right=d*aspect;camera.top=d;camera.bottom=-d;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
}
init();
</script>
</body>
</html>
